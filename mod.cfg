# AutoSave 1.1.0 — description approved by the user.
setf ~title [ASI] Автосохранение / AutoSave
setf ~description {
[h1][ASI] Автосохранение / AutoSave[/h1]

Автоматически сохраняет игру после важных событий и через заданный интервал активной игры.

[b]Когда сохраняет[/b]

[list]
[*]После получения груза.
[*]После успешной сдачи груза.
[*]После победы в кольцевой гонке и начисления награды.
[*]После покупки автомобиля.
[*]После найма водителя.
[*]Каждые [b]10 минут активной игры[/b] по умолчанию.
[/list]

[b]История автосохранений[/b]

По умолчанию мод хранит [b]3 последних автосохранения[/b]:

[list]
[*]autosave_1 - самое свежее сохранение.
[*]autosave_2 - предыдущее сохранение.
[*]autosave_3 - самое старое сохранение.
[/list]

При новом автосохранении предыдущие состояния автоматически сдвигаются. Порядок сохраняется после перезапуска игры.

Другие ручные сохранения не затрагиваются.

Во время паузы, открытых меню или переключения в другое приложение автосохранение откладывается до возвращения в игру.

Несколько событий могут объединяться в одно сохранение.

[b]Настройки[/b]

Файл plugins/HT2_AutoSave.ini автоматически создаётся при первом запуске.

Можно настроить:

[list]
[*]Интервал автосохранения.
[*]Количество слотов.
[*]Уведомления в игре.
[*]Каждый триггер автосохранения отдельно.
[/list]

Существующие настройки сохраняются и не перезаписываются модом.

Для применения изменений необходимо перезапустить игру.

[b]Совместимость[/b]

[b]Требуется ASI Loader.[/b]

Поддерживаемые версии игры:

[list]
[*][b]SteamRU / Дальнобойщики 2 v8.1[/b]
[*][b]SteamWW / Hard Truck 2: King of the Road v1.3[/b] (английская, французская, немецкая и испанская версии).
[*][b]Modified Game Core 8.2[/b]
[/list]

Уведомления в игровом пейджере доступны на русском, английском, французском, немецком и испанском языках.

[b]Рекомендация:[/b] перед первым использованием мода сделайте резервную копию своего игрового профиля в корке игры файл с разсирением .pl1 .



[h1][ASI] AutoSave / Автосохранение[/h1]

Automatically saves your game after important events and at configurable intervals during active gameplay.

[b]When Does It Save?[/b]

[list]
[*]After picking up cargo.
[*]After successfully delivering cargo.
[*]After winning a circuit race and receiving the reward.
[*]After purchasing a vehicle.
[*]After hiring a driver.
[*]Every [b]10 minutes of active gameplay[/b] by default.
[/list]

[b]Save History[/b]

By default, the mod keeps your [b]3 most recent autosaves[/b]:

[list]
[*]autosave_1 - most recent save.
[*]autosave_2 - previous save.
[*]autosave_3 - oldest save.
[/list]

Older saves are shifted automatically when a new autosave is created. The correct order is maintained after restarting the game.

Your other manual save slots remain untouched.

Autosaving is postponed while the game is paused, a menu is open, or the game is not in focus. Pending saves are processed when you return to active gameplay.

Multiple events may be combined into a single autosave.

[b]Configuration[/b]

The plugins/HT2_AutoSave.ini file is created automatically on the first launch.

You can customize:

[list]
[*]Autosave interval.
[*]Number of autosave slots.
[*]In-game notifications.
[*]Each autosave trigger independently.
[/list]

Your existing settings are preserved and won't be overwritten by the mod.

Restart the game to apply configuration changes.

[b]Compatibility[/b]

[b]ASI Loader is required.[/b]

Supported game versions:

[list]
[*][b]SteamRU / Дальнобойщики 2 v8.1[/b]
[*][b]SteamWW / Hard Truck 2: King of the Road v1.3[/b] (English, French, German and Spanish versions).
[*][b]Modified Game Core 8.2[/b]
[/list]

In-game pager notifications are available in Russian, English, French, German and Spanish.

[b]Recommendation:[/b] Before using the mod for the first time, back up your save profile - the .pl1 file in the game's root folder.
}
setf ~tags {"UI" "Other"}
setf ~preview_image autosave.png
setf ~version 1.1.0
setf ~visibility public
setf ~priority 0
setf ~exclusive 0
setf ~conflicts {}
